<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Create Account</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🚀</div>
                <h1>Create Account</h1>
                <p>Get started with your free account today</p>
            </div>

            <div id="alertBox" class="error-message"></div>
            <div id="successBox" class="success-message"></div>

            <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="fullname" name="fullname" required placeholder="John Doe" autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" required placeholder="At least 6 characters" minlength="6" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔐</span>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password" autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertBox');
            const successBox = document.getElementById('successBox');

            alertBox.style.display = 'none';
            successBox.style.display = 'none';

            if (password !== confirmPassword) {
                alertBox.textContent = 'Passwords do not match.';
                alertBox.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                alertBox.textContent = 'Password must be at least 6 characters long.';
                alertBox.style.display = 'block';
                return;
            }

            const btn = event.target.querySelector('button[type="submit"]');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            setTimeout(() => {
                successBox.textContent = 'Account created successfully! Redirecting to login...';
                successBox.style.display = 'block';
                btn.textContent = 'Create Account';
                btn.disabled = false;
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }, 800);
        }
    </script>
</body>
</html>
